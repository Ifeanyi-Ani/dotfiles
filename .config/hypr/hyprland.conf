
# Monitor Configuration
monitor=,preferred,auto,1

# Execute at launch
# exec-once = nm-applet --indicator
# exec-once = swaync
exec-once = waybar
exec-once = systemd-run --user --slice=app.slice -p Nice=-15 brave-browser --preload

exec-once = hyprpaper
exec-once = dunst
exec-once = wl-clipboard-history -t
# exec-once = wl-paste --type text --watch cliphist store
# exec-once = wl-paste --type image --watch cliphist store
# exec-once = hypridle
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Environment Variables
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QPA_PLATFORM,wayland

# Input Configuration
input {
    kb_layout = us
    follow_mouse = true
    sensitivity = 0
    accel_profile = flat
    
    touchpad {
			disable_while_typing = true
			natural_scroll = true 
			clickfinger_behavior = false
			middle_button_emulation = true
			tap-to-click = true
			drag_lock = false
    }
}

# General Window Layout/Appearance
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(7aa2f7ee) rgba(ad8ee6ee) 45deg
    col.inactive_border = rgba(414868aa)
    layout = dwindle

		resize_on_border = true  
    extend_border_grab_area = 15
    hover_icon_on_border = true
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_cancel_ratio = 0.5
    workspace_swipe_create_new = false
    workspace_swipe_forever = true
}

# Decoration settings for windows
decoration {
    rounding = 8
    blur {
        enabled = false
        size = 6
        passes = 2
        new_optimizations = true
        brightness = 1.0
        contrast = 1.0
        noise = 0.02
    }
    drop_shadow = true
    shadow_ignore_window = true
    shadow_range = 20
    shadow_render_power = 3
    col.shadow = 0x55000000
    active_opacity = 1.0
    inactive_opacity = 0.92
}

# Animations
animations {
    enabled = false
    
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    
    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = windowsMove, 1, 4, default
    animation = border, 1, 10, default
    animation = fade, 1, 10, smoothIn
    animation = fadeDim, 1, 10, smoothIn
    animation = workspaces, 1, 6, default
}

# Layout settings
dwindle {
    pseudotile = true
    preserve_split = true
    no_gaps_when_only = true
}

master {
    # new_is_master = true
    no_gaps_when_only = true
}

# Misc settings
misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  vfr = true
  vrr = 2
  mouse_move_enables_dpms = true
  enable_swallow = off
  swallow_regex = ^(kitty)$
  focus_on_activate = false
  initial_workspace_tracking = 0
  middle_click_paste = false
}

binds {
  workspace_back_and_forth = true
  allow_workspace_cycles = true
  pass_mouse_when_bound = false
}


cursor {
  no_hardware_cursors = 2 # change to 1 if want to disable
  enable_hyprcursor = true
  warp_on_change_workspace = 2
  no_warps = true 
}
# Window Rules
windowrule = float, ^(pavucontrol)$
windowrule = float, ^(blueman-manager)$
windowrule = float, ^(nm-connection-editor)$
windowrule = float, ^(file-roller)$

# Key Bindings
$mainMod = ALT

bind = $mainMod, Q, killactive,
# bind = $mainMod SHIFT, Q, exec, killall wofi
bind = $mainMod, F, togglefloating,
bind = $mainMod, D, exec, rofi -show drun
bind = $mainMod, space, exec, rofi -show drun
bind = $mainMod, Tab, exec, rofi -show window
# bind = $mainMod, P, exec, pseudo 
bind = $mainMod, S, togglesplit, 
bind = $mainMod SHIFT, E,  exit,
bind = $mainMod, semicolon, exec, swaylock -f -c 000000
bind = $mainMod SHIFT, semicolon, exec, systemctl suspend
bind = $mainMod SHIFT, R, exec, hyprctl reload

# Application launchers
bind = $mainMod, RETURN, exec, kitty 
bind = $mainMod, B, exec, brave-browser
bind = $mainMod, E, exec, thunar
bind = $mainMod, V, exec, pavucontrol
bind = $mainMod, N, exec, networkmanager_dmenu
# bind = CTRL ALT, L, exec, swaylock -f -c 000000

# Window management
bind = $mainMod, G, togglegroup
bind = $mainMod, Tab, changegroupactive
bind = $mainMod, M, fullscreen, 1  
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod, Period, togglespecialworkspace, magic
bind = $mainMod SHIFT, Period, movetoworkspace, special:magic
bind = $mainMod, grave, togglespecialworkspace
bind = $mainMod SHIFT, grave, movetoworkspace, special

# Add workspace navigation with mouse
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Screenshot with selection and save to file
bind = $mainMod SHIFT, S, exec, grimshot copy area
bind = $mainMod CTRL, S, exec, grimshot save area ~/Pictures/Screenshots/$(date +"%Y-%m-%d_%H-%M-%S").png

# custom script binding
bind = $mainMod SHIFT, X, exec, ~/.config/wofi/powermenu.sh

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

# Move focused window with Vim keys
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, j, movewindow, d
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, l, movewindow, r

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume keys
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
bind = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMute, exec, pamixer -t

# Brightness keys
bind = , XF86MonBrightnessUp, exec, brightnessctl set +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-


# Resize submap
bind = $mainMod, R, submap, resize
submap = resize
binde = , l, resizeactive, 10 0
binde = , h, resizeactive, -10 0
binde = , k, resizeactive, 0 -10
binde = , j, resizeactive, 0 10
bind = , escape, submap, reset


binde = , right, resizeactive, 10 0
binde = , left, resizeactive, -10 0
binde = , up, resizeactive, 0 -10
binde = , down, resizeactive, 0 10
bind = , escape, submap, reset
binde = , right, resizeactive, 10 0
binde = , left, resizeactive, -10 0
binde = , up, resizeactive, 0 -10
binde = , down, resizeactive, 0 10
bind = , R, submap, reset
submap = reset

# Dynamic workspace behavior
workspace = 1, monitor:eDP-1, default:true, persistent:true
workspace = 2, monitor:eDP-1, persistent:true
workspace = 3, monitor:eDP-1, persistent:true
workspace = 4, monitor:eDP-1, persistent:true

# Automatically send apps to specific workspaces
windowrule = workspace 1 silent, ^(alacritty)$
windowrule = workspace 2 silent, ^(code)$
windowrule = workspace 3 silent, ^(brave-browser)$
windowrule = workspace 4 silent, ^(thunar)$
